services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: money_matrix
      POSTGRES_PASSWORD: money_matrix_local
      POSTGRES_DB: money_matrix_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_matrix -d money_matrix_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - money_matrix_postgres:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  money_matrix_postgres:

